<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>電影查詢系統</title>
    <style>
        body {
            background-color: #d7d5e6; 
            color: black; 
            font-family: '微軟正黑體', sans-serif;
            padding: 30px;
            margin: 0;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .search-box {
            text-align: center;
            margin-bottom: 40px;
            background-color: #b8b2d1;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #a4a1bf;
            display: inline-block;
        }
        .search-box input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #a4a1bf;
            width: 250px;
        }
        .search-box button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #d7d5e6;
            border: 1px solid #a4a1bf;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .search-box button:hover {
            background-color: #a4a1bf;
        }
        .movie-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
        }
        .movie-card {
            background-color: #b8b2d1;
            border: 2px solid #a4a1bf;
            border-radius: 12px;
            width: 260px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
        }
        .movie-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .movie-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        .movie-info {
            margin-bottom: 8px;
            font-size: 0.95em;
        }
        .movie-link {
            margin-top: auto; 
            padding-top: 15px;
            text-align: center;
        }
        .movie-link a {
            text-decoration: none;
            color: black;
            font-weight: bold;
            background-color: #d7d5e6;
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #a4a1bf;
        }
        .movie-link a:hover {
            background-color: #a4a1bf;
        }
        .no-result {
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }
        .nav-link {
            display: block;
            text-align: center;
            margin-top: 40px;
        }
        .nav-link a {
            color: black;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>電影資訊查詢系統</h2>
        
        <!-- 搜尋表單：使用 GET 方法將 keyword 傳給 /movie3 -->
        <div class="search-box">
            <form action="/movie3" method="GET">
                <label for="keyword">請輸入電影關鍵字：</label>
                <input type="text" id="keyword" name="keyword" value="{{ keyword }}" required placeholder="例如：我的">
                <button type="submit">查詢</button>
            </form>
        </div>
    </div>
    
    <!-- 顯示查詢結果 -->
    <div class="movie-container">
        {% if keyword %}
            {% if movies %}
                {% for movie in movies %}
                <div class="movie-card">
                    <img src="{{ movie.picture }}" alt="{{ movie.title }}">
                    <div class="movie-title">{{ movie.title }}</div>
                    <div class="movie-info">📅 上映日期：{{ movie.showDate }}</div>
                    <div class="movie-info">⏳ 片長：{{ movie.showLength }} 分鐘</div>
                    <div class="movie-link">
                        <a href="{{ movie.hyperlink }}" target="_blank">查看詳情</a>
                    </div>
                </div>
                {% endfor %}
            {% else %}
                <div class="no-result">找不到包含「{{ keyword }}」的電影喔！</div>
            {% endif %}
        {% endif %}
    </div>

    <div class="nav-link">
        <a href="/">返回首頁</a>
    </div>

</body>
</html>
